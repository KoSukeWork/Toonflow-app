services:
  toonflow:
    image: toonflow:lan-multi-user-arm64
    platform: linux/arm64
    init: true
    restart: unless-stopped
    ports:
      - "0.0.0.0:6060:3000"
    environment:
      TOONFLOW_MULTI_USER: "1"
      TOONFLOW_ADMIN_USERNAME: "${TOONFLOW_ADMIN_USERNAME:-admin}"
      TOONFLOW_ADMIN_PASSWORD: "${TOONFLOW_ADMIN_PASSWORD:-}"
      TOONFLOW_SECURE_COOKIES: "${TOONFLOW_SECURE_COOKIES:-0}"
    volumes:
      - ./data:/app/data
